zerops:
  - setup: api
    build:
      base: alpine/python@3.12
      deployFiles: server/~
      addToRunPrepare:
        - requirements.txt
    run:
      base: alpine/python@3.12
      prepareCommands:
        - python3 -m pip install -r requirements.txt --ignore-installed
      ports:
        - port: 8000
          httpSupport: true
      start: uvicorn app.main:app --host 0.0.0.0 --port 8000

  - setup: worker
    build:
      base: alpine/python@3.12
      deployFiles: server/~
      addToRunPrepare:
        - requirements.txt
    run:
      base: alpine/python@3.12
      prepareCommands:
        - python3 -m pip install -r requirements.txt --ignore-installed
      start: python3 worker.py

  - setup: web
    build:
      base: nodejs@20
      buildCommands:
        - npm i
        - npm run build
      deployFiles:
        - dist/~
      cache:
        - node_modules
        - package-lock.json
    run:
      base: static
