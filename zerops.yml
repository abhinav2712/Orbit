zerops:
  - setup: api
    build:
      base: alpine/python@3.12
      deployFiles: server/~
      addToRunPrepare:
        - requirements.txt
    run:
      base: alpine/python@3.12
      prepareCommands:
        - python3 -m pip install -r requirements.txt --ignore-installed
      ports:
        - port: 8000
          httpSupport: true
      start: uvicorn app.main:app --host 0.0.0.0 --port 8000
      envVariables:
        DATABASE_URL: ${postgresql_connectionString}
        REDIS_URL: ${valkey_connectionTlsString}

  - setup: worker
    build:
      base: alpine/python@3.12
      deployFiles: server/~
      addToRunPrepare:
        - requirements.txt
    run:
      base: alpine/python@3.12
      prepareCommands:
        - python3 -m pip install -r requirements.txt --ignore-installed
      start: python3 worker.py
      envVariables:
        DATABASE_URL: ${postgresql_connectionString}
        REDIS_URL: ${valkey_connectionTlsString}
        S3_ENDPOINT_URL: ${objectstorage_apiUrl}
        S3_ACCESS_KEY_ID: ${objectstorage_accessKeyId}
        S3_SECRET_ACCESS_KEY: ${objectstorage_secretAccessKey}
        S3_BUCKET_NAME: ${objectstorage_bucketName}

  - setup: web
    build:
      base: nodejs@20
      buildCommands:
        - cd web && npm i && npm run build
      deployFiles:
        - web/dist/~
      cache:
        - web/node_modules
        - web/package-lock.json
    run:
      base: static

